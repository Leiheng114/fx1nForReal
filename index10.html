<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>森林模拟器 · 第六天夜晚</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Courier New',monospace;color:#cfc;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center}

#viewport{position:relative;width:min(100vw,calc(100vh*4/3));height:min(100vh,calc(100vw*3/4));background:#000;overflow:hidden}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;cursor:crosshair}

#crt{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.16) 3px,rgba(0,0,0,0) 4px);
  box-shadow:inset 0 0 130px rgba(0,0,0,.85)}

#crosshair{position:absolute;left:50%;top:50%;width:clamp(20px,4.5vh,58px);height:clamp(20px,4.5vh,58px);transform:translate(-50%,-50%);pointer-events:none;z-index:6;opacity:.6}
#crosshair:before,#crosshair:after{content:'';position:absolute;background:#dfe;box-shadow:0 0 2px #000}
#crosshair:before{left:calc(50% - 1px);top:0;width:2px;height:100%}
#crosshair:after{left:0;top:calc(50% - 1px);width:100%;height:2px}

#hint{position:absolute;left:50%;top:7%;transform:translateX(-50%);font-size:clamp(12px,2.4vh,30px);color:#cef2c0;text-align:center;text-shadow:0 0 4px #000,0 0 8px #000;white-space:pre-line;z-index:7;display:none;line-height:1.7}
#msg{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);font-size:clamp(14px,3vh,38px);color:#ffd97a;text-shadow:0 0 6px #000,0 0 12px #000;z-index:7;display:none;text-align:center;white-space:nowrap}

#interact{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:7;display:none;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,14px)}
#interact-label{font-size:clamp(13px,2.6vh,32px);color:#fff;text-shadow:0 0 5px #000;white-space:nowrap}
#progress{width:clamp(220px,38vh,520px);height:clamp(12px,2.4vh,26px);border:2px solid #9cb;background:rgba(0,0,0,.55)}
#progress-fill{width:0%;height:100%;background:linear-gradient(90deg,#aef,#4f8)}

#stamina{position:absolute;left:2.5%;bottom:3.5%;z-index:7;width:clamp(120px,22vh,280px)}
#stamina-label{font-size:clamp(9px,1.5vh,16px);color:#9cd;text-shadow:0 0 4px #000;letter-spacing:3px;margin-bottom:4px}
#stamina-bar{width:100%;height:clamp(8px,1.5vh,16px);border:2px solid #457;background:rgba(0,0,0,.55)}
#stamina-fill{width:100%;height:100%;background:linear-gradient(90deg,#7f6,#3c6)}

#map-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:40;flex-direction:column;gap:clamp(4px,1vh,10px)}
#map{border:3px solid #4a7;background:#06120a;image-rendering:pixelated;image-rendering:crisp-edges;width:min(62vh,62vw);box-shadow:0 0 30px #000}
.map-t{font-size:clamp(16px,3.4vh,38px);letter-spacing:8px;color:#8f8;text-shadow:0 0 6px #000}
.map-h{font-size:clamp(10px,1.8vh,18px);color:#686;letter-spacing:2px}

.overlay{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:60;text-align:center}
#pause .t{font-size:clamp(18px,4vh,42px);letter-spacing:8px;color:#cfe8b0;margin-bottom:clamp(16px,4vh,40px)}
#pause button{font-family:inherit;background:#14251a;color:#bff0b8;border:2px solid #4a7;padding:clamp(8px,1.8vh,18px) clamp(20px,4vh,44px);font-size:clamp(14px,3vh,30px);letter-spacing:4px;cursor:pointer;transition:.2s}
#pause button:hover{background:#1d3523;color:#fff}

/* ===== 倒计时（屏幕上方） ===== */
#countdown{position:absolute;left:50%;top:6%;transform:translateX(-50%);font-size:clamp(30px,7vh,70px);color:#ffd97a;text-shadow:0 0 10px #000,0 0 20px #000;z-index:8;display:none;font-family:'Courier New',monospace;letter-spacing:8px}

/* ===== 闭眼全黑 ===== */
#black-overlay{position:fixed;inset:0;background:#000;z-index:120;display:none}

/* ===== 冲向玩家的图片 ===== */
#rush-overlay{position:fixed;inset:0;background:#000;z-index:130;display:none;align-items:center;justify-content:center;overflow:hidden;pointer-events:none}
#rush-img{width:100px;height:auto;transform-origin:center center;transition:transform .7s linear;will-change:transform}

/* ===== day6 Night 黑色开场（点击直接开始，无淡出） ===== */
#intro{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:90;text-align:center}
#intro .day{font-size:clamp(40px,11vh,130px);letter-spacing:14px;color:#cfe8b0;text-shadow:0 0 20px #274;font-family:'Courier New',monospace}
#click-hint{font-size:clamp(12px,2.4vh,26px);color:#566;letter-spacing:3px;margin-top:clamp(22px,5vh,50px);display:none;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.12}}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="viewport">
  <canvas id="game" width="320" height="240"></canvas>
  <div id="crt"></div>
  <div id="crosshair"></div>
  <div id="hint"></div>
  <div id="msg"></div>
  <div id="countdown">60</div>
  <div id="interact">
    <div id="interact-label"></div>
    <div id="progress"><div id="progress-fill"></div></div>
  </div>
  <div id="stamina">
    <div id="stamina-label">体 力</div>
    <div id="stamina-bar"><div id="stamina-fill"></div></div>
  </div>
</div>

<div id="map-overlay">
  <div class="map-t">地 图</div>
  <canvas id="map" width="480" height="480"></canvas>
  <div class="map-h">按 Tab 关闭地图</div>
</div>

<div class="overlay hidden" id="pause">
  <div class="t">游 戏 暂 停</div>
  <button id="resume-btn">点击继续</button>
</div>

<!-- day6 Night 开场 -->
<div id="intro">
  <div class="day">day6 Night</div>
  <div id="click-hint">点击任意处继续</div>
</div>

<!-- 闭眼全黑 -->
<div id="black-overlay"></div>

<!-- 冲向玩家的图片 -->
<div id="rush-overlay">
  <img id="rush-img" src="retouch_2026080702442799.png">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ============ 常量 ============ */
const MAP=200;
const GEN_POS=[[-170,-170],[170,-170],[-170,170],[170,170]];
const WALK_SPEED=16, SPRINT_MULT=1.8;
const FLASH_DIST=72;
const CAVE5_INTERVAL=49000;     /* 每 49 秒 Cave.cave5.wav.mp3 */
const COUNTDOWN_SEC=60;         /* 四台启动后倒计时 1 分钟 */
const EYES_CLOSED_SEC=20;       /* 闭眼 20 秒 */
const EYES_OPEN_IMG_SEC=8;      /* 睁眼 8 秒后图片冲向玩家 */

/* ============ 渲染器（320×240 夜晚） ============ */
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
renderer.setSize(320,240,false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x03040a);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.BasicShadowMap;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x03040a,10,72);

const camera=new THREE.PerspectiveCamera(65,4/3,0.1,400);
camera.rotation.order='YXZ';

/* ============ 灯光 ============ */
scene.add(new THREE.AmbientLight(0x0a0e14,1.0));

const flash=new THREE.SpotLight(0xfff1d8,2.0,FLASH_DIST,0.5,0.6,0);
flash.castShadow=true;
flash.shadow.mapSize.set(512,512);
flash.shadow.camera.near=1; flash.shadow.camera.far=FLASH_DIST+8;
flash.shadow.bias=-0.002;
scene.add(flash);
const flashTarget=new THREE.Object3D();
scene.add(flashTarget);
flash.target=flashTarget;

const beam=new THREE.Mesh(
  new THREE.CylinderGeometry(7.5,0.6,62,12,1,true),
  new THREE.MeshBasicMaterial({color:0xfff2cf,transparent:true,opacity:0.05,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})
);
beam.rotation.x=-Math.PI/2; beam.position.set(0,0,-31);
camera.add(beam);
scene.add(camera);

/* ============ 地面 + 边界 ============ */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP*2+160,MAP*2+160),new THREE.MeshLambertMaterial({color:0x08120a}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

const hedgeMat=new THREE.MeshLambertMaterial({color:0x05120a,flatShading:true});
[[0,1],[0,-1],[1,0],[-1,0]].forEach(function(e){
  const sx=e[0],sz=e[1];
  const h=new THREE.Mesh(new THREE.BoxGeometry(sx?2:MAP*2,3.2,sz?2:MAP*2),hedgeMat);
  h.position.set(sx*(MAP-1),1.6,sz*(MAP-1));
  h.castShadow=true; h.receiveShadow=true; scene.add(h);
});

/* ============ 树木 ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(20240517);
const treePos=[];
const N=520;
for(let i=0;i<N;i++){
  let ok=false,x=0,z=0;
  for(let tries=0;tries<30&&!ok;tries++){
    x=(rng()*2-1)*(MAP-10); z=(rng()*2-1)*(MAP-10);
    if(x*x+z*z<34*34) continue;
    ok=true;
    for(const g of GEN_POS){ const dx=x-g[0],dz=z-g[1]; if(dx*dx+dz*dz<22*22){ok=false;break;} }
    if(ok) treePos.push([x,z]);
  }
}
const trunkGeo=new THREE.CylinderGeometry(0.35,0.6,3,5);
const folGeo=new THREE.ConeGeometry(1.7,3.6,6);
const trunkMat=new THREE.MeshLambertMaterial({color:0x241708,flatShading:true});
const folMat=new THREE.MeshLambertMaterial({color:0x0d2412,flatShading:true});
const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,treePos.length);
const fols=new THREE.InstancedMesh(folGeo,folMat,treePos.length);
const m=new THREE.Matrix4(),q=new THREE.Quaternion(),eu=new THREE.Euler(),v=new THREE.Vector3(),s=new THREE.Vector3();
for(let i=0;i<treePos.length;i++){
  const x=treePos[i][0],z=treePos[i][1];
  const sc=0.75+rng()*1.1, ry=rng()*Math.PI*2;
  eu.set(0,ry,0); q.setFromEuler(eu);
  v.set(x,1.5*sc,z); s.set(sc,sc,sc); m.compose(v,q,s); trunks.setMatrixAt(i,m);
  v.set(x,3+1.8*sc,z); s.set(sc*0.9,sc,sc*0.9); m.compose(v,q,s); fols.setMatrixAt(i,m);
}
trunks.castShadow=fols.castShadow=true;
scene.add(trunks); scene.add(fols);

/* ============ 发电机 ============ */
const gens=[];
const gBody=new THREE.MeshLambertMaterial({color:0x3a4045,flatShading:true});
const gDark=new THREE.MeshLambertMaterial({color:0x181c1f,flatShading:true});
GEN_POS.forEach(function(gp){
  const g=new THREE.Group();
  const base=new THREE.Mesh(new THREE.BoxGeometry(5,0.7,3.6),gDark); base.position.y=0.35; base.receiveShadow=true; g.add(base);
  const body=new THREE.Mesh(new THREE.BoxGeometry(4.2,3,2.6),gBody); body.position.y=2.2; body.castShadow=true; g.add(body);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(3,0.5,2),gDark); cap.position.y=3.95; g.add(cap);
  const lampMat=new THREE.MeshBasicMaterial({color:0xff2222});
  const lamp=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.7,0.7),lampMat); lamp.position.y=4.7; g.add(lamp);
  const light=new THREE.PointLight(0xff2222,2.6,60,1); light.position.y=4.5; g.add(light);
  g.position.set(gp[0],0,gp[1]); scene.add(g);
  gens.push({group:g,lampMat:lampMat,light:light,x:gp[0],z:gp[1],started:false});
});

/* ============ 家（倒计时开始后会被移除） ============ */
const homeGroup=(function makeHome(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(14,8,12),new THREE.MeshLambertMaterial({color:0x4a3524,flatShading:true}));
  body.position.y=4; body.castShadow=true; g.add(body);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(12,5,4),new THREE.MeshLambertMaterial({color:0x241708,flatShading:true}));
  roof.position.y=10.5; roof.rotation.y=Math.PI/4; roof.castShadow=true; g.add(roof);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(2.4,4.4),new THREE.MeshBasicMaterial({color:0x0f0703}));
  door.position.set(0,2.2,6.03); g.add(door);
  const win=new THREE.Mesh(new THREE.PlaneGeometry(3,2),new THREE.MeshBasicMaterial({color:0xffb35a}));
  win.position.set(3.6,4.4,6.03); g.add(win);
  const dl=new THREE.PointLight(0xffa14d,1.7,48,1); dl.position.set(0,3,5); g.add(dl);
  const ring=new THREE.Mesh(new THREE.RingGeometry(5.5,8,36),new THREE.MeshBasicMaterial({color:0xffc87a,transparent:true,opacity:0.5,side:THREE.DoubleSide}));
  ring.rotation.x=-Math.PI/2; ring.position.set(0,0.06,13); g.add(ring);
  const inner=new THREE.Mesh(new THREE.CircleGeometry(5.5,36),new THREE.MeshBasicMaterial({color:0xffe0a0,transparent:true,opacity:0.16}));
  inner.rotation.x=-Math.PI/2; inner.position.set(0,0.05,13); g.add(inner);
  scene.add(g);
  return g;
})();

/* ============ 玩家 / 状态 ============ */
const player=new THREE.Vector3(0,0,30);
const eye=new THREE.Vector3();
let yaw=0,pitch=0,moving=false,bobT=0;
const keys={};
let locked=false,mapOpen=false;
let state='intro';        /* intro → playing → countdown → close_prompt → eyes_closed → open_prompt → eyes_open → rush */
let progress=0,nearGen=-1,endingTriggered=false;
let stamina=100,exhaustedTimer=0,sprinting=false;
const MAX_STA=100;
let gensStarted=0;
let countdownStart=0;
let eyesClosedStart=0;
let eyesOpenStart=0;

/* ============ 输入 ============ */
document.addEventListener('keydown',function(e){
  if(e.code==='Tab'){
    e.preventDefault();
    if(state==='playing'){ mapOpen=!mapOpen; document.getElementById('map-overlay').style.display=mapOpen?'flex':'none'; }
    return;
  }
  /* 倒计时结束后：按 E 闭眼 */
  if(state==='close_prompt'&&e.code==='KeyE'){ e.preventDefault(); doCloseEyes(); return; }
  /* 20 秒后：按 E 睁眼 */
  if(state==='open_prompt'&&e.code==='KeyE'){ e.preventDefault(); doOpenEyes(); return; }
  keys[e.code]=true;
});
document.addEventListener('keyup',function(e){ keys[e.code]=false; });
document.addEventListener('mousemove',function(e){
  if(!locked)return;
  /* 倒计时与睁眼期间玩家均可自由转动视角 */
  if(state==='playing'||state==='countdown'||state==='eyes_open'){
    yaw-=e.movementX*0.0023;
    pitch-=e.movementY*0.0023;
    pitch=Math.max(-1.45,Math.min(1.45,pitch));
  }
});
document.addEventListener('pointerlockchange',function(){
  locked=!!(document.pointerLockElement===document.body||document.pointerLockElement===canvas);
  if(!locked){ if(state==='playing') document.getElementById('pause').classList.remove('hidden'); }
  else document.getElementById('pause').classList.add('hidden');
});
canvas.addEventListener('click',function(){
  if((state==='playing'||state==='countdown'||state==='eyes_open')&&!locked){ try{document.body.requestPointerLock();}catch(err){} }
});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
window.addEventListener('blur',function(){ for(const k in keys) keys[k]=false; });

/* ============ 音频 ============ */
let AC=null,master=null,heartTimer=null,humNodes=[],heartGain=null;
let ambGain=null,ambNodes=[],crackleTimer=null,cave5Timer=null,cave5Audio=null;
let humanAudio=null;
let heartPeriod=0.88,heartVol=0.6;
let heartTargetPeriod=0.88,heartTargetVol=0.6;

function initAudio(){
  if(AC)return;
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(err){ return; }
  master=AC.createGain(); master.gain.value=0.8; master.connect(AC.destination);
  gens.forEach(function(_,i){
    const osc=AC.createOscillator(); osc.type='sawtooth'; osc.frequency.value=50+i*1.3;
    const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=150; f.Q.value=2;
    const gn=AC.createGain(); gn.gain.value=0;
    osc.connect(f); f.connect(gn); gn.connect(master); osc.start();
    humNodes.push({gn:gn});
  });
}
function noiseBuffer(sec){
  const len=Math.floor(AC.sampleRate*sec),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return buf;
}

/* ===== 电流氛围声（信号干扰） ===== */
function startAmbient(){
  if(!AC||ambGain)return;
  ambGain=AC.createGain(); ambGain.gain.value=0; ambGain.connect(master);
  ambNodes=[];
  const hum=[];
  const freqs=[50,100,150,200,250];
  freqs.forEach(function(f,i){
    const o=AC.createOscillator();
    o.type=i===0?'sine':'triangle';
    o.frequency.value=f;
    const g=AC.createGain();
    g.gain.value=i===0?0.13:0.03/i;
    o.connect(g); g.connect(ambGain); o.start();
    hum.push({o:o});
  });
  ambNodes=ambNodes.concat(hum.map(function(h){return h.o;}));
  const drift=AC.createOscillator(); drift.type='sine'; drift.frequency.value=0.08;
  const driftAmt=AC.createGain(); driftAmt.gain.value=1.2;
  drift.connect(driftAmt);
  hum.forEach(function(h){ driftAmt.connect(h.o.frequency); });
  drift.start(); ambNodes.push(drift);
  const ripple=AC.createOscillator(); ripple.type='sine'; ripple.frequency.value=100;
  const rippleAmt=AC.createGain(); rippleAmt.gain.value=0.035;
  ripple.connect(rippleAmt); rippleAmt.connect(ambGain.gain);
  ripple.start(); ambNodes.push(ripple);
  const hiss=AC.createBufferSource(); hiss.buffer=noiseBuffer(2); hiss.loop=true;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=900;
  const hg=AC.createGain(); hg.gain.value=0.011;
  hiss.connect(hp); hp.connect(hg); hg.connect(ambGain);
  hiss.start(); ambNodes.push(hiss);
  function pop(){
    if(!AC||!ambGain)return;
    const t=AC.currentTime+0.02;
    const s=AC.createBufferSource(); s.buffer=noiseBuffer(0.03);
    const bp=AC.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=1400+Math.random()*2800; bp.Q.value=2.2;
    const cg=AC.createGain();
    cg.gain.setValueAtTime(0.0001,t);
    cg.gain.exponentialRampToValueAtTime(0.10,t+0.005);
    cg.gain.exponentialRampToValueAtTime(0.0001,t+0.022);
    s.connect(bp); bp.connect(cg); cg.connect(ambGain);
    s.start(t); s.stop(t+0.03);
    crackleTimer=setTimeout(pop,900+Math.random()*2600);
  }
  pop();
  ambGain.gain.setTargetAtTime(0.26,AC.currentTime,1.4);
}
function stopAmbient(){
  if(crackleTimer){clearTimeout(crackleTimer);crackleTimer=null;}
  if(ambGain){ try{ambGain.gain.setTargetAtTime(0,AC.currentTime,0.08);}catch(e){} }
  if(ambNodes.length){ setTimeout(function(){ ambNodes.forEach(function(n){try{n.stop();}catch(e){}}); },250); }
  ambGain=null; ambNodes=[];
}

/* Cave.cave5.wav.mp3 每 49 秒一次（四台启动后停止） */
function playCave5(){
  if(!AC||(state!=='playing'))return;
  try{
    if(!cave5Audio){ cave5Audio=new Audio('Cave.cave5.wav.mp3'); cave5Audio.volume=0.8; }
    cave5Audio.currentTime=0;
    cave5Audio.play().catch(function(){});
  }catch(e){}
}
function scheduleCave5(){ if(cave5Timer)clearInterval(cave5Timer); cave5Timer=setInterval(playCave5,CAVE5_INTERVAL); }

/* Cave.cave12.wav.mp3：启动第一台发电机 7 秒后播放一次 */
function playCave12(){
  if(!AC||(state!=='playing'&&state!=='countdown'))return;
  try{
    const a=new Audio('Cave.cave12.wav.mp3'); a.volume=0.8;
    a.play().catch(function(){});
  }catch(e){}
}

/* human.mp3：循环呼吸声（倒计时期间播放，倒计时结束后停止） */
function startHuman(){
  try{
    humanAudio=new Audio('human.mp3');
    humanAudio.loop=true; humanAudio.volume=0.5;
    humanAudio.play().catch(function(){});
  }catch(e){}
}
function stopHuman(){ if(humanAudio){try{humanAudio.pause();}catch(e){} humanAudio=null;} }

/* ===== 心跳：支持目标速度控制（倒计时/闭眼期间最快，睁眼后慢慢平复） ===== */
function setHeartMax(){ heartTargetPeriod=0.32; heartTargetVol=0.95; }    /* 完全最快 */
function setHeartNormal(){ heartTargetPeriod=0.88; heartTargetVol=0.6; }   /* 正常 */
function updateHeartbeat(dt){
  if(!AC)return;
  /* 平滑逼近目标：加速快（拉满）、平复慢（慢慢恢复） */
  heartPeriod+=(heartTargetPeriod-heartPeriod)*Math.min(1,dt*1.6);
  heartVol+=(heartTargetVol-heartVol)*Math.min(1,dt*0.8);
  if(heartGain) heartGain.gain.value=heartVol;
}
function thump(t,delay){
  const o=AC.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(58,t+delay);
  o.frequency.exponentialRampToValueAtTime(34,t+delay+0.14);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t+delay);
  g.gain.exponentialRampToValueAtTime(0.9*heartVol,t+delay+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+delay+0.3);
  o.connect(g); if(heartGain) g.connect(heartGain);
  o.start(t+delay); o.stop(t+delay+0.32);
}
function startHeartbeat(){
  if(!AC)return; stopHeartbeat();
  heartGain=AC.createGain(); heartGain.gain.value=heartVol; heartGain.connect(master);
  heartPeriod=0.88; heartVol=0.6;
  heartTargetPeriod=0.88; heartTargetVol=0.6;
  (function loop(){
    const t=AC.currentTime+0.06;
    thump(t,0); thump(t,heartPeriod*0.36);
    heartTimer=setTimeout(loop,Math.max(0.3,heartPeriod)*1000-25);
  })();
}
function stopHeartbeat(){ if(heartTimer){clearTimeout(heartTimer);heartTimer=null;} if(heartGain){try{heartGain.disconnect();}catch(e){} heartGain=null;} }
function playGenStart(){
  if(!AC)return;
  const t=AC.currentTime;
  const src=AC.createBufferSource(); src.buffer=noiseBuffer(0.08);
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=900;
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);
  src.connect(f);f.connect(g);g.connect(master);src.start(t);src.stop(t+0.1);
  const o=AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(55,t+0.05); o.frequency.exponentialRampToValueAtTime(190,t+0.9);
  const lf=AC.createBiquadFilter(); lf.type='lowpass'; lf.frequency.value=320;
  const og=AC.createGain(); og.gain.setValueAtTime(0.0001,t+0.05); og.gain.exponentialRampToValueAtTime(0.22,t+0.5); og.gain.exponentialRampToValueAtTime(0.05,t+1.0);
  o.connect(lf);lf.connect(og);og.connect(master);o.start(t+0.05);o.stop(t+1.1);
  const c=AC.createOscillator(); c.type='sine';
  c.frequency.setValueAtTime(80,t+0.95); c.frequency.exponentialRampToValueAtTime(45,t+1.15);
  const cg=AC.createGain(); cg.gain.setValueAtTime(0.0001,t+0.95); cg.gain.exponentialRampToValueAtTime(0.6,t+0.98); cg.gain.exponentialRampToValueAtTime(0.0001,t+1.25);
  c.connect(cg);cg.connect(master);c.start(t+0.95);c.stop(t+1.3);
}
function stopAllAudio(){
  stopHeartbeat();
  stopAmbient();
  stopHuman();
  if(cave5Timer){clearInterval(cave5Timer);cave5Timer=null;}
  if(cave5Audio){try{cave5Audio.pause();}catch(e){} cave5Audio=null;}
  humNodes.forEach(function(h){ if(h) try{h.gn.gain.setTargetAtTime(0,AC.currentTime,0.1);}catch(e){} });
  if(AC){ try{ AC.suspend(); }catch(e){} }
}

/* ============ HUD ============ */
const hintEl=document.getElementById('hint'),msgEl=document.getElementById('msg');
const interactEl=document.getElementById('interact'),interactLabel=document.getElementById('interact-label');
const progressFill=document.getElementById('progress-fill');
const staminaFill=document.getElementById('stamina-fill');
const countdownEl=document.getElementById('countdown');
const mapOverlay=document.getElementById('map-overlay'),mapCanvas=document.getElementById('map'),mapCtx=mapCanvas.getContext('2d');
let hintTimer=null,msgTimer=null;
function showHint(t){ hintEl.textContent=t; hintEl.style.display='block'; }
function hideHintSoon(ms){ if(hintTimer)clearTimeout(hintTimer); hintTimer=setTimeout(function(){hintEl.style.display='none';},ms); }
function showMsg(t,persist){ msgEl.textContent=t; msgEl.style.display='block'; if(!persist){ if(msgTimer)clearTimeout(msgTimer); msgTimer=setTimeout(function(){msgEl.style.display='none';},2600);} }
function hideMsg(){ msgEl.style.display='none'; }

/* ============ 地图 ============ */
function drawMap(){
  const W=480,P=44,S=W-P*2,ctx=mapCtx;
  ctx.fillStyle='#05120a'; ctx.fillRect(0,0,W,W);
  function px(x){return P+(x+MAP)/(2*MAP)*S;}
  function py(z){return P+(z+MAP)/(2*MAP)*S;}
  ctx.strokeStyle='rgba(80,160,100,0.10)'; ctx.lineWidth=1;
  for(let i=-200;i<=200;i+=50){
    ctx.beginPath();ctx.moveTo(px(i),P);ctx.lineTo(px(i),P+S);ctx.stroke();
    ctx.beginPath();ctx.moveTo(P,py(i));ctx.lineTo(P+S,py(i));ctx.stroke();
  }
  ctx.strokeStyle='#3f8'; ctx.lineWidth=2; ctx.strokeRect(P,P,S,S);
  gens.forEach(function(g){
    const x=px(g.x),y=py(g.z);
    if(g.started){
      ctx.fillStyle='rgba(60,255,110,0.15)'; ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();
      ctx.strokeStyle='#4f6'; ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-7,y-7);ctx.lineTo(x+7,y+7);ctx.moveTo(x+7,y-7);ctx.lineTo(x-7,y+7);ctx.stroke();
    }else{
      ctx.fillStyle='rgba(255,60,60,0.18)'; ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();
      ctx.strokeStyle='#f55'; ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(x-7,y-7);ctx.lineTo(x+7,y+7);ctx.moveTo(x+7,y-7);ctx.lineTo(x-7,y+7);ctx.stroke();
    }
  });
  const hx=px(0),hy=py(0);
  ctx.fillStyle='#ffd76a'; ctx.strokeStyle='#ffd76a'; ctx.lineWidth=2;
  ctx.fillRect(hx-8,hy-2,16,12);
  ctx.beginPath();ctx.moveTo(hx-9,hy-1);ctx.lineTo(hx,hy-12);ctx.lineTo(hx+9,hy-1);ctx.closePath();ctx.fill();
  ctx.font='12px monospace'; ctx.fillText('家',hx-6,hy+24);
  const pfx=-Math.sin(yaw),pfz=-Math.cos(yaw);
  const pxx=px(player.x),pyy=py(player.z);
  ctx.fillStyle='#7fd4ff'; ctx.beginPath();ctx.arc(pxx,pyy,5,0,7);ctx.fill();
  ctx.strokeStyle='#7fd4ff'; ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(pxx,pyy);ctx.lineTo(pxx+pfx*16,pyy+pfz*16);ctx.stroke();
  ctx.font='12px monospace'; ctx.fillStyle='#9fe'; ctx.fillText('你',pxx+8,pyy-6);
  ctx.fillStyle='rgba(200,240,200,0.5)'; ctx.font='14px monospace'; ctx.fillText('北',P+S/2-7,P+14);
  ctx.font='11px monospace'; ctx.fillStyle='#7a8';
  ctx.fillText('红 X：发电机（未启动）　绿 X：发电机（已启动）',P,W-16);
}

/* ============ 核心逻辑 ============ */
function collide(){
  const b=MAP-1.5;
  if(player.x<-b)player.x=-b; if(player.x>b)player.x=b;
  if(player.z<-b)player.z=-b; if(player.z>b)player.z=b;
  for(let i=0;i<treePos.length;i++){
    const dx=player.x-treePos[i][0],dz=player.z-treePos[i][1],d2=dx*dx+dz*dz;
    if(d2<6.0){ const d=Math.sqrt(d2)||0.001,ov=2.45-d; player.x+=dx/d*ov; player.z+=dz/d*ov; }
  }
  for(const g of gens){
    const dx=player.x-g.x,dz=player.z-g.z,d2=dx*dx+dz*dz;
    if(d2<14.4){ const d=Math.sqrt(d2)||0.001,ov=3.8-d; player.x+=dx/d*ov; player.z+=dz/d*ov; }
  }
  if(player.x>-7.5&&player.x<7.5&&player.z>-6.5&&player.z<6.5){
    const dl=player.x+7.5,dr=7.5-player.x,db=player.z+6.5,df=6.5-player.z,mm=Math.min(dl,dr,db,df);
    if(mm===dl)player.x=-7.5; else if(mm===dr)player.x=7.5; else if(mm===db)player.z=-6.5; else player.z=6.5;
  }
}
function updatePlayer(dt){
  if(mapOpen){ moving=false; return; }
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  const rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let mx=0,mz=0;
  if(keys['KeyW']){mx+=fx;mz+=fz;}
  if(keys['KeyS']){mx-=fx;mz-=fz;}
  if(keys['KeyD']){mx+=rx;mz+=rz;}
  if(keys['KeyA']){mx-=rx;mz-=rz;}
  moving=(mx!==0||mz!==0);
  const wantSprint=!!(keys['ShiftLeft']||keys['ShiftRight']);
  sprinting=wantSprint&&stamina>0&&moving;
  if(sprinting){ stamina-=26*dt; if(stamina<=0){stamina=0; exhaustedTimer=2.6;} }
  else if(stamina<MAX_STA){
    if(exhaustedTimer>0) exhaustedTimer-=dt;
    else stamina=Math.min(MAX_STA,stamina+15*dt);
  }
  staminaFill.style.width=stamina+'%';
  staminaFill.style.background=stamina<25?'linear-gradient(90deg,#f66,#c33)':'linear-gradient(90deg,#7f6,#3c6)';
  if(moving){
    const l=Math.hypot(mx,mz); mx/=l;mz/=l;
    const sp=WALK_SPEED*(sprinting?SPRINT_MULT:1);
    player.x+=mx*sp*dt; player.z+=mz*sp*dt;
    bobT+=dt*(sprinting?14:10);
  }
  collide();
}
function updateFlash(){
  const bob=moving?Math.sin(bobT)*(sprinting?0.1:0.05):0;
  eye.set(player.x,player.y+1.6+bob,player.z);
  camera.position.copy(eye);
  flash.position.copy(eye);
  flashTarget.position.set(eye.x-Math.sin(yaw)*45,eye.y,eye.z-Math.cos(yaw)*45);
}
function updateAudio(){
  if(!AC)return;
  let ni=-1,nd=1e9;
  for(let i=0;i<gens.length;i++){
    if(gens[i].started)continue;
    const dx=player.x-gens[i].x,dz=player.z-gens[i].z,d=Math.sqrt(dx*dx+dz*dz);
    if(d<nd){nd=d;ni=i;}
  }
  nearGen=(ni>=0&&nd<10)?ni:-1;
  for(let i=0;i<gens.length;i++){
    let tg=0;
    if(gens[i].started) tg=0.05;
    if(humNodes[i]) humNodes[i].gn.gain.setTargetAtTime(tg,AC.currentTime,0.25);
  }
}
function startGen(i){
  const g=gens[i];
  g.started=true;
  g.lampMat.color.setHex(0x22ff55);
  g.light.color.setHex(0x22ff55);
  playGenStart();
  gensStarted++;
  /* 第一台发电机启动 7 秒后，播放一次 Cave.cave12.wav.mp3 */
  if(gensStarted===1){ setTimeout(playCave12,7000); }
  /* 四台全部启动后 → 开始倒计时（停止 Cave.cave5、家消失、心跳拉满） */
  if(gensStarted===4){ setTimeout(startCountdownPhase,1200); }
}

/* ===== 倒计时阶段（四台启动后） ===== */
function startCountdownPhase(){
  if(state!=='playing')return;
  state='countdown';
  /* 停止 Cave.cave5 与信号干扰、发电机嗡鸣，只剩心跳 + human.mp3 */
  if(cave5Timer){clearInterval(cave5Timer);cave5Timer=null;}
  if(cave5Audio){try{cave5Audio.pause();}catch(e){} cave5Audio=null;}
  stopAmbient();
  humNodes.forEach(function(h){ if(h) try{h.gn.gain.setTargetAtTime(0,AC.currentTime,0.15);}catch(e){} });
  /* 家消失 */
  scene.remove(homeGroup);
  interactEl.style.display='none';
  hideMsg();
  /* 心跳完全加快（保持最快） */
  setHeartMax();
  /* 只剩心跳 + 人类呼吸声 */
  startHuman();
  /* 显示倒计时 */
  countdownStart=performance.now();
  countdownEl.style.display='block';
  countdownEl.textContent=COUNTDOWN_SEC;
}

function endCountdown(){
  state='close_prompt';
  countdownEl.style.display='none';
  stopHuman();                    /* human.mp3 在倒计时结束后停止 */
  if(document.pointerLockElement){ try{document.exitPointerLock();}catch(e){} }
  showMsg('按 E 闭上眼睛',true);
}

function doCloseEyes(){
  state='eyes_closed';
  hideMsg();
  document.getElementById('black-overlay').style.display='block';   /* 闭眼：屏幕完全黑暗 */
  eyesClosedStart=performance.now();
  /* 闭眼期间心跳保持最快（无需额外设置，目标仍是 Max） */
}

function doOpenEyes(){
  state='eyes_open';
  hideMsg();
  document.getElementById('black-overlay').style.display='none';
  eyesOpenStart=performance.now();
  /* 睁眼后：心跳在 8 秒内慢慢平复到正常 */
  setHeartNormal();
}

function playRush(){
  state='rush';
  stopAllAudio();                /* 图片出现前停止所有音频（含心跳） */
  if(document.pointerLockElement){ try{document.exitPointerLock();}catch(e){} }
  mapOpen=false; mapOverlay.style.display='none';
  hideMsg();
  /* 图片冲向玩家：从远处瞬间放大到覆盖全屏 */
  const rushOverlay=document.getElementById('rush-overlay');
  const rushImg=document.getElementById('rush-img');
  rushImg.style.transition='none';
  rushImg.style.transform='scale(1)';
  rushOverlay.style.display='flex';
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      rushImg.style.transition='transform .7s linear';
      rushImg.style.transform='scale(48)';
    });
  });
  /* 图片触碰到玩家后 → 跳转 index11.html */
  setTimeout(function(){ window.location.href='index11.html'; },800);
}

/* ============ HUD 更新（仅 playing） ============ */
function updateHUD(dt){
  if(nearGen>=0&&!gens[nearGen].started){
    interactEl.style.display='flex';
    interactLabel.textContent='按住 [E] 启动发电机';
    if(keys['KeyE']){
      progress+=dt/2.6;
      if(progress>=1){ startGen(nearGen); progress=0; interactEl.style.display='none'; }
    } else progress=0;
    progressFill.style.width=Math.min(100,progress*100)+'%';
  } else {
    interactEl.style.display='none'; progress=0;
  }
}

/* ============ day6 Night 黑色开场（点击直接开始，无淡出） ============ */
const introEl=document.getElementById('intro');
const clickHint=document.getElementById('click-hint');
setTimeout(function(){ clickHint.style.display='block'; },800);

function startGame(){
  state='playing';
  startHeartbeat();
  startAmbient();
  scheduleCave5();               /* 每 49 秒 Cave.cave5.wav.mp3 */
  showHint('第六天 · 夜晚：再次重启森林四角的四台发电机。\n按 Tab 查看地图，靠近发电机按住 E 启动。');
  hideHintSoon(9000);
}

document.addEventListener('click', function onIntroClick(){
  if(state!=='intro') return;
  document.removeEventListener('click', onIntroClick);
  state='playing';
  introEl.style.display='none';
  try{ const p=document.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(function(){}); }catch(err){}
  try{ document.body.requestPointerLock(); }catch(err){}
  initAudio();
  startGame();
});

document.getElementById('resume-btn').addEventListener('click',function(){
  try{ document.body.requestPointerLock(); }catch(err){}
});

/* ============ 主循环 ============ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const now=performance.now();

  if(state==='playing'){
    updatePlayer(dt);
    updateFlash();
    updateAudio();
    updateHUD(dt);
    updateHeartbeat(dt);
  } else if(state==='countdown'){
    updatePlayer(dt);           /* 倒计时期间玩家可自由移动 */
    updateFlash();
    updateHeartbeat(dt);        /* 心跳保持最快 */
    const left=COUNTDOWN_SEC-(now-countdownStart)/1000;
    if(left<=0){
      countdownEl.textContent='0';
      endCountdown();
    } else {
      countdownEl.textContent=Math.ceil(left);
    }
  } else if(state==='eyes_closed'){
    updateHeartbeat(dt);        /* 闭眼 20 秒心跳保持最快 */
    if(now-eyesClosedStart>=EYES_CLOSED_SEC*1000){
      state='open_prompt';
      showMsg('按 E 睁开眼睛',true);
    }
  } else if(state==='eyes_open'){
    updatePlayer(dt);           /* 睁眼后可自由移动 */
    updateFlash();
    updateHeartbeat(dt);        /* 心跳在 8 秒内慢慢平复 */
    if(now-eyesOpenStart>=EYES_OPEN_IMG_SEC*1000){
      playRush();
    }
  }

  if(mapOpen) drawMap();
  camera.rotation.y=yaw; camera.rotation.x=pitch;
  renderer.render(scene,camera);
}
animate();
})();
